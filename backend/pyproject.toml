[project]
name = "language-learning-backend"
version = "0.1.0"
description = "Look up -> LLM card generation -> self-hosted FSRS store, plus review / decks / auth"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.5",
    "anthropic>=0.49",
    "fsrs>=5.0,<6.0",
    "openai>=3.6.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "zstandard>=0.25.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false
